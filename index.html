<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>Face Capture Reference</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">FC</span><span>Face Capture</span></div>
      <div class="privacy-state"><span class="status-dot" aria-hidden="true"></span><span>Local processing</span></div>
    </header>

    <main class="workspace">
      <section class="capture-area" aria-label="Camera capture">
        <div class="view-switch" role="tablist" aria-label="Preview source">
          <button id="camera-tab" class="view-option is-active" type="button" role="tab" aria-selected="true">Camera</button>
          <button id="recording-tab" class="view-option" type="button" role="tab" aria-selected="false" disabled>Recording</button>
        </div>

        <div id="media-stage" class="media-stage" data-state="idle">
          <video id="camera" class="camera-video" autoplay muted playsinline aria-label="Camera preview"></video>
          <video id="recording" class="recording-video" muted playsinline controls aria-label="Recorded preview" hidden></video>
          <canvas id="landmarks" class="landmark-layer" aria-hidden="true"></canvas>
          <div class="face-guide" aria-hidden="true"><span></span></div>
          <div id="empty-state" class="empty-state">
            <span class="camera-symbol" aria-hidden="true"></span>
            <strong>Camera is off</strong>
          </div>
          <div id="stage-status" class="stage-status" role="status">Ready</div>
        </div>
      </section>

      <aside class="inspector" aria-label="Capture controls">
        <section class="control-section">
          <h1>Face action capture</h1>
          <div class="button-row">
            <button id="start-camera" class="primary-command" type="button">Start camera</button>
            <button id="stop-camera" class="secondary-command" type="button" disabled>Stop</button>
          </div>
          <div class="action-switch" role="group" aria-label="Action challenge">
            <button id="blink-action" class="action-option is-active" type="button" aria-pressed="true">Blink</button>
            <button id="mouth-action" class="action-option" type="button" aria-pressed="false">Open mouth</button>
          </div>
          <button id="record-video" class="record-command" type="button" disabled>
            <span class="record-indicator" aria-hidden="true"></span>
            Start challenge
          </button>
        </section>

        <section class="control-section metrics-section" aria-labelledby="device-heading">
          <h2 id="device-heading">Camera</h2>
          <dl class="metrics">
            <div><dt>Resolution</dt><dd id="camera-resolution">-</dd></div>
            <div><dt>Frame rate</dt><dd id="camera-fps">-</dd></div>
            <div><dt>Face model</dt><dd id="model-state">Not loaded</dd></div>
            <div><dt>Face state</dt><dd id="face-state">-</dd></div>
          </dl>
        </section>

        <section class="control-section metrics-section" aria-labelledby="output-heading">
          <h2 id="output-heading">Last recording</h2>
          <dl class="metrics">
            <div><dt>Action</dt><dd id="recording-action">-</dd></div>
            <div><dt>Format</dt><dd id="recording-format">-</dd></div>
            <div><dt>Resolution</dt><dd id="recording-resolution">-</dd></div>
            <div><dt>Duration</dt><dd id="recording-duration">-</dd></div>
            <div><dt>Size</dt><dd id="recording-size">-</dd></div>
          </dl>
          <a id="download-recording" class="download-command" href="#" hidden>Download recording</a>
        </section>

        <p id="error-message" class="error-message" role="alert" hidden></p>
      </aside>
    </main>

    <footer>
      <span>No media leaves this page.</span>
      <a href="./privacy.html">Privacy</a>
    </footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
